version = 1

# override: the Standard text contains *example* SPDX headers (in §4.3) that must not be
# parsed as real license tags — the REUSE.toml annotation is authoritative for these files.
[[annotations]]
path = ["The_Steelbore_Standard.texi", "The_Steelbore_Standard.md", ".gitignore", "REUSE.toml"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Agent context files (§5.7). Tracked artifacts, so they need REUSE coverage; they
# carry no inline SPDX tags because CLAUDE.md's first non-heading line must be the
# bare `@AGENTS.md` import. Document-class → CC-BY-SA-4.0.
[[annotations]]
path = ["AGENTS.md", "CLAUDE.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# CI tooling is software-class (§4.1.1) → GPL-3.0-or-later, even though the Standard
# document itself is CC-BY-SA-4.0.
[[annotations]]
path = ".github/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"
SPDX-License-Identifier = "GPL-3.0-or-later"
