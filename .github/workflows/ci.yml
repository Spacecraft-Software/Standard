name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: REUSE + config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install reuse pyyaml

      - name: REUSE lint
        run: reuse lint

      - name: Validate JSON / JSONC / TOML / YAML
        run: python3 .github/validate-configs.py

      # §6.5: .gitattributes and .editorconfig are advisory to the tools that
      # read them, and neither stops CRLF committed by a tool that reads
      # neither.
      #
      # The gate reads the INDEX, not the working tree. `git ls-files --eol`
      # reports the stored line ending as i/lf, i/crlf or i/mixed; anything
      # but i/lf is CRLF in the repository. Grepping the working tree for a
      # CR byte is wrong: a file pinned `eol=crlf` is stored LF and checked
      # out CRLF by design, so a working-tree grep fails the very exception
      # §6.5 grants. i/-text is binary and is not a text file at all.
      - name: Text file format (LF line endings, §6.5)
        run: |
          bad=$(git ls-files --eol | awk -F'\t' '$1 ~ /i\/(crlf|mixed)/ {print $2}')
          if [ -n "$bad" ]; then
            echo "::error::CRLF stored in tracked text files — §6.5 requires LF"
            echo "$bad"
            exit 1
          fi

  # The Standard cites skills by id, but the catalogue lives in Construct, so
  # nothing here could tell whether a cited skill exists. It shipped for months
  # naming `spacecraft-accessibility` when the skill had always been
  # `spacecraft-accessibility-support` — silently, because a missing skill does
  # not announce itself; it simply never loads, and §18 work directed at it
  # proceeds without it.
  #
  # This job checks out Construct read-only (both repos are public, so no token)
  # and runs Construct's checker against this document. The dependency direction
  # is deliberate: the Standard cites the catalogue, so the Standard validates
  # against it. The version check is off — this document's own masthead version
  # is the one legitimate pin in the ecosystem.
  skill-refs:
    name: Skill references resolve against the Construct catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Spacecraft-Software/Construct
          path: .construct
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill references
        run: |
          python3 .construct/.github/check-skill-refs.py \
            --catalogue .construct \
            --no-version-check \
            The_Steelbore_Standard.texi The_Steelbore_Standard.md
